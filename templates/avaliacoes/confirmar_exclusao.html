
{% extends 'base.html' %}

{% block title %}Excluir Estação - {{ block.super }}{% endblock title %}

{% block body %}
<div class="row justify-content-center" data-aos="zoom-in-up">
    <div class="col-lg-6">
        <div class="bento-card p-4 text-center">
            <div class="icon-box mx-auto mb-3">
                <i data-lucide="alert-triangle"></i>
            </div>

            <h4 class="fw-bold mb-3">Confirmar Exclusão</h4>

            <p class="text-secondary">
                Tem certeza de que deseja excluir a estação
                <strong>{{ estacao.identificacao }}</strong>?
            </p>

            <p class="text-secondary small">
                Esta ação não poderá ser desfeita.
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="d-flex justify-content-center gap-2 mt-4">
                    <a href="{% url 'avaliacoes:listar_estacoes' %}" class="btn btn-outline-light px-4">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-danger px-4">
                        <i data-lucide="trash-2" size="16"></i>
                        Confirmar Exclusão
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock body %}
