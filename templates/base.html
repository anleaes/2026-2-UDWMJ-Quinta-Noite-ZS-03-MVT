{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SalãoApp Studio — Gestão & Estética{% endblock title %}</title>

    <!-- Aplica o tema salvo (Claro ou Escuro) antes de renderizar a página -->
    <script>
        document.documentElement.setAttribute('data-bs-theme', localStorage.getItem('salaoapp_theme') || 'dark');
    </script>

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bibliotecas CSS Externas -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <!-- Nosso CSS Separado -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    {% block extra_css %}{% endblock extra_css %}
</head>
<body>
    <div class="aurora-bg"></div>

    {% include 'partials/_navbar.html' %}

    <main class="container pb-5">
        {% block body %}
        {% endblock body %}
    </main>

    <!-- Bibliotecas JS Externas -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- Nosso JS Separado -->
    <script src="{% static 'js/animations.js' %}"></script>
    {% block extra_js %}{% endblock extra_js %}
</body>
</html>
