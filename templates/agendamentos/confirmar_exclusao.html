
{% extends 'base.html' %}

{% block body %}
<div class="container mt-4">
    <h2>Excluir Agendamento</h2>

    <p>
        Tem certeza de que deseja excluir o agendamento de
        <strong>{{ agendamento.cliente }}</strong>,
        marcado para
        <strong>{{ agendamento.data_hora_inicio|date:"d/m/Y H:i" }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Confirmar Exclusão
        </button>

        <a href="{% url 'agendamentos:listar_agendamentos' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
