
{% extends 'base.html' %}

{% block body %}
<div class="container mt-4">
    <h2>
        {% if atendimento %}
            Editar Item de Atendimento
        {% else %}
            Cadastrar Item de Atendimento
        {% endif %}
    </h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Salvar
        </button>

        <a href="{% url 'atendimentos:listar_atendimentos' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
